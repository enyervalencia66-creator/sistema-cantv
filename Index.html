async function submitCambiarClave(e) {
    e.preventDefault();
    if (!validarFormulario(e.target)) return;
    const actual = document.getElementById('ccActual').value;
    const nueva = document.getElementById('ccNueva').value;
    const confirmar = document.getElementById('ccConfirmar').value;
    const err = document.getElementById('ccError');
    const errText = document.getElementById('ccErrorText');
    const btn = document.getElementById('ccSubmitBtn');

    err.classList.add('hidden');

    if (nueva !== confirmar) {
        errText.innerText = 'Las contraseñas nuevas no coinciden.';
        err.classList.remove('hidden');
        return;
    }
    if (nueva === actual) {
        errText.innerText = 'La nueva contraseña debe ser distinta a la actual.';
        err.classList.remove('hidden');
        return;
    }
    if (passwordContieneDatosPersonales(nueva, currentUser.username, currentUser.name)) {
        errText.innerText = 'La nueva contraseña no debe contener tu nombre ni tu nombre de usuario.';
        err.classList.remove('hidden');
        return;
    }

    if (!lockAction(btn, 'Verificando...')) return;
    try {
        // La contraseña actual se valida contra el servidor: el navegador nunca guarda ni recibe
        // contraseñas de nadie, así que no hay caché local contra la cual comparar.
        const verifyRes = await fetch('/api/auth/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: currentUser.username, password: actual })
        });
        if (!verifyRes.ok) {
            errText.innerText = 'La contraseña actual es incorrecta.';
            err.classList.remove('hidden');
            return;
        }

        btn.innerHTML = `<span class="btn-spinner"></span>Guardando...`;
        const res = await fetch(`/api/db/users/id/${currentUser.id}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ password: nueva })
        });
        if (!res.ok) throw new Error('request failed');

        closeModalUI(true);
        showToast('Contraseña actualizada exitosamente', 'success');
    } catch (ex) {
        console.error('submitCambiarClave error:', ex);
        errText.innerText = 'Error al actualizar la contraseña. Intenta de nuevo.';
        err.classList.remove('hidden');
    } finally {
        unlockAction(btn);
    }
}

let inactivityTimer = null;
function resetInactivityTimer() {
    if (!currentUser) return;
    clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => {
        logout(true);
    }, 30 * 60 * 1000); // 30 minutes
}

function logout(dueToInactivity = false) {
    // El cierre por inactividad siempre procede (es un timeout de seguridad); el cierre manual
    // se bloquea mientras haya una acción en curso para no interrumpirla a mitad de camino.
    if (isSubmitting && !dueToInactivity) {
        showToast('Espera a que termine la acción en curso antes de cerrar sesión', 'warning');
        return;
    }
    currentUser = null;
    sessionStorage.removeItem('cantv_token');
    sessionStorage.removeItem('cantv_user');
    clearTimeout(inactivityTimer);
    navigate('login');
    if (dueToInactivity === true) {
        setTimeout(() => uiAlert('Su sesión ha expirado por inactividad. Por favor ingrese de nuevo.'), 100);
    }
}

async function sendResetEmail(e) {
    e.preventDefault();
    const err = document.getElementById('resetError');
    const succ = document.getElementById('resetSuccess');
    const btn = document.getElementById('btnSendEmail');

    err.classList.add('hidden'); succ.classList.add('hidden');
    if (!validarFormulario(e.target)) return;
    const username = document.getElementById('resetUsername').value.trim();
    if (!lockAction(btn, 'Enviando...')) return;

    try {
        const res = await fetch('/api/auth/reset', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        });
        if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.error || 'Usuario no encontrado o error del servidor');
        }
        const data = await res.json();

        document.getElementById('resetSuccessText').innerText = `Revisa la bandeja de entrada de ${data.email}: te enviamos un código de seguridad.`;
        succ.classList.remove('hidden');

        setTimeout(() => {
            navigate('reset-password', { email: data.email });
        }, 2000);
    } catch (ex) {
        console.error(ex);
        document.getElementById('resetErrorText').innerText = ex.message;
        err.classList.remove('hidden');
    }

    unlockAction(btn);
}

async function submitNewPassword(e) {
    e.preventDefault();
    const err = document.getElementById('confirmError');
    err.classList.add('hidden');
    if (!validarFormulario(e.target)) return;

    const email = document.getElementById('confirmEmail').value.trim();
    const token = document.getElementById('confirmToken').value.trim();
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmNewPassword').value;
    const btn = document.getElementById('btnConfirmReset');

    if (newPass !== confirmPass) {
        document.getElementById('confirmErrorText').innerText = 'Las contraseñas no coinciden';
        err.classList.remove('hidden');
        return;
    }
    // No hay sesión activa en este flujo (recuperación pública), así que se compara contra el
    // usuario asociado al correo ingresado (parte local del email) en vez del nombre completo.
    if (passwordContieneDatosPersonales(newPass, email.split('@')[0])) {
        document.getElementById('confirmErrorText').innerText = 'La nueva contraseña no debe contener tu nombre de usuario ni parte de tu correo.';
        err.classList.remove('hidden');
        return;
    }

    if (!lockAction(btn, 'Verificando...')) return;

    try {
        const res = await fetch('/api/auth/reset/confirm', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, token, newPassword: newPass })
        });
        if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.error || 'Código inválido o error del servidor');
        }

        await uiAlert("¡Contraseña actualizada exitosamente! Ya puedes iniciar sesión.", '¡Éxito!');
        navigate('login');
    } catch (ex) {
        console.error(ex);
        document.getElementById('confirmErrorText').innerText = ex.message;
        err.classList.remove('hidden');
    }
    unlockAction(btn);
}

// Genera el PDF en el servidor y lo descarga directamente, sin pasar por el diálogo de impresión
// del navegador (que en algunos entornos se queda esperando una impresora que no existe).
async function descargarReportePdf(e) {
    const btn = e && e.currentTarget ? e.currentTarget : null;
    if (!lockAction(btn, 'Generando PDF...')) return;

    const total = document.getElementById('kpiTotal') ? document.getElementById('kpiTotal').innerText : '0';
    const rate = document.getElementById('kpiRate') ? document.getElementById('kpiRate').innerText.replace('%', '') : '0';
    const avg = document.getElementById('kpiAvgTime') ? document.getElementById('kpiAvgTime').innerText.replace(' d', '') : '0';
    const comp = document.getElementById('kpiCompliance') ? document.getElementById('kpiCompliance').innerText.replace('%', '') : '0';

    try {
        const res = await fetch('/api/reports/pdf', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                titulo: 'Reporte de Gestión Mensual',
                generadoPor: `${currentUser.name} (${currentUser.role})`,
                total, tasaCierre: rate, avgDays: avg, cumplimiento: comp
            })
        });
        if (!res.ok) throw new Error('El servidor no pudo generar el PDF.');

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Reporte_Gestion_${new Date().toISOString().split('T')[0]}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    } catch (err) {
        uiAlert('Error al generar el PDF: ' + err.message);
    }

    unlockAction(btn);
}

// Exporta el detalle completo de un Caso a PDF. Los nombres de personas involucradas se resuelven
// aquí en el cliente (que ya tiene el directorio de personas cargado) y se envían junto al resto
// de los datos del caso, para que el servidor no tenga que volver a consultar la base de datos.
async function exportarCasoPdf(e, id) {
    const btn = e && e.currentTarget ? e.currentTarget : null;
    const c = db.casos.find(x => x.id == id);
    if (!c) return showToast('Caso no encontrado.', 'error');
    if (!lockAction(btn, 'Generando PDF...')) return;

    try {
        const personasInvolucradasDetalle = (c.personasInvolucradas || []).map(ced => {
            const p = db.personas.find(x => x.cedula === ced);
            return { cedula: ced, nombre: p ? p.nombre : ced, grado: (c.implicaciones && c.implicaciones[ced]) || 'No Definido' };
        });

        const res = await fetch('/api/casos/pdf', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...c, personasInvolucradasDetalle })
        });
        if (!res.ok) throw new Error('El servidor no pudo generar el PDF.');

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Caso_${c.id}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    } catch (err) {
        showToast('Error al generar el PDF: ' + err.message, 'error');
    }

    unlockAction(btn);
}

// Botón "Últimos 7 días": limpia los filtros (fecha, región, especialista) de vuelta a su valor
// por defecto y de paso refresca los datos del Dashboard desde el servidor.
function refrescarDashboard() {
    const inicioEl = document.getElementById('dashFechaInicio');
    const finEl = document.getElementById('dashFechaFin');
    const regionEl = document.getElementById('dashRegion');
    const espEl = document.getElementById('dashEsp');
    const hoy = new Date();
    if (finEl) finEl.value = toDateInputValue(hoy);
    if (inicioEl) inicioEl.value = toDateInputValue(new Date(hoy.getTime() - 7 * 24 * 60 * 60 * 1000));
    if (regionEl) regionEl.value = 'all';
    if (espEl) espEl.value = 'all';
    initDashboard();
    refreshInBackground();
}

function initDashboard() {
    // Collect Filters
    const regionEl = document.getElementById('dashRegion');
    const region = regionEl ? regionEl.value : currentUser.region;
    
    // Populate Specialists Dropdown based on region
    const espDropdown = document.getElementById('dashEsp');
    const currentEspSelection = espDropdown.value;
    
    let regionUsers = db.users.filter(u => u.role === ROLES.ESP);
    if (region !== 'all') regionUsers = regionUsers.filter(u => u.region === region);
    
    espDropdown.innerHTML = `<option value="all">Todos</option>` + regionUsers.map(u => `<option value="${u.username}" ${u.username===currentEspSelection?'selected':''}>${u.name} (${u.username})</option>`).join('');
    
    const esp = espDropdown.value;

    // Filter Logic
    let filtered = db.casos;
    
    if (region !== 'all') {
        const rUsers = db.users.filter(u => u.region === region).map(u => u.username);
        filtered = filtered.filter(c => rUsers.includes(c.creadorOriginal));
    }
    
    if (esp !== 'all') {
        filtered = filtered.filter(c => c.creadorOriginal === esp);
    }
    
    // Rango de fecha: por defecto los últimos 7 días (ya vienen así en los inputs), pero el
    // usuario puede elegir "Desde"/"Hasta" para ampliar o acotar el período mostrado.
    const inicioEl = document.getElementById('dashFechaInicio');
    const finEl = document.getElementById('dashFechaFin');
    if (inicioEl && inicioEl.value && finEl && finEl.value) {
        const inicioMs = new Date(inicioEl.value + 'T00:00:00').getTime();
        const finMs = new Date(finEl.value + 'T23:59:59.999').getTime();
        const [desde, hasta] = inicioMs <= finMs ? [inicioMs, finMs] : [finMs, inicioMs];
        filtered = filtered.filter(c => {
            const t = new Date(c.fechaApertura).getTime();
            return t >= desde && t <= hasta;
        });
    }

    // Calculate KPIs
    document.getElementById('kpiTotal').innerText = filtered.length;
    
    const closed = filtered.filter(c => c.estado === ESTADOS_CASO.CERRADO);
    if (filtered.length > 0) {
        document.getElementById('kpiRate').innerText = Math.round((closed.length / filtered.length) * 100) + '%';
    } else {
        document.getElementById('kpiRate').innerText = '0%';
    }

    let totalMs = 0;
    closed.forEach(c => {
        const start = new Date(c.fechaApertura).getTime();
        const end = c.estadoUpdateMs;
        totalMs += (end - start);
    });
    
    if (closed.length > 0) {
        const avgDays = totalMs / closed.length / (1000 * 60 * 60 * 24);
        document.getElementById('kpiAvgTime').innerText = (avgDays < 1 ? '< 1' : Math.round(avgDays)) + ' d';
    } else {
        document.getElementById('kpiAvgTime').innerText = '-';
    }

    // Calcular Cumplimiento Mensual (On Time)
    let cumplidos = 0;
    filtered.forEach(c => {
        if (!c.fechaLimite) return;
        const limitDate = new Date(c.fechaLimite);
        limitDate.setHours(23, 59, 59, 999);
        
        if (c.estado === ESTADOS_CASO.CERRADO) {
            if (c.estadoUpdateMs <= limitDate.getTime()) cumplidos++;
        } else {
            if (Date.now() <= limitDate.getTime()) cumplidos++;
        }
    });
    
    if (filtered.length > 0) {
        document.getElementById('kpiCompliance').innerText = Math.round((cumplidos / filtered.length) * 100) + '%';
    } else {
        document.getElementById('kpiCompliance').innerText = '0%';
    }

    // Chart 1: Specialists
    const espData = {};
    closed.forEach(c => {
        espData[c.creadorOriginal] = (espData[c.creadorOriginal] || 0) + 1;
    });

    if (chartEspInstance) chartEspInstance.destroy();
    chartEspInstance = new Chart(document.getElementById('chartEspecialistas'), {
        type: 'bar',
        data: {
            labels: Object.keys(espData).length ? Object.keys(espData) : ['Sin Datos'],
            datasets: [{
                label: 'Casos Resueltos',
                data: Object.keys(espData).length ? Object.values(espData) : [0],
                backgroundColor: '#3B82F6',
                borderRadius: 3
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#e5e7eb' } }, x: { grid: { display: false } } } }
    });

    // Chart 2: Regions
    const regData = {};
    filtered.forEach(c => {
        const creatorUser = db.users.find(u => u.username === c.creadorOriginal);
        if (creatorUser) {
            regData[creatorUser.region] = (regData[creatorUser.region] || 0) + 1;
        }
    });

    if (chartRegInstance) chartRegInstance.destroy();
    chartRegInstance = new Chart(document.getElementById('chartRegiones'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(regData).length ? Object.keys(regData) : ['Sin Datos'],
            datasets: [{
                data: Object.keys(regData).length ? Object.values(regData) : [1],
                backgroundColor: ['#3B82F6', '#E5007E', '#10b981', '#f59e0b'],
                borderWidth: 0
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } }
    });
}

function renderSolicitudes() {
    let list = db.solicitudes;
    if (!hasPermission('apruebo_incidencias')) {

    const isRechazada = s => s.estado === 'RECHAZADO' || s.estado === 'Rechazada por Gerencia';
    const pendientesList = list.filter(s => !isAprobada(s) && !isRechazada(s));
    const aprobadasList = list.filter(isAprobada);
    const rechazadasList = list.filter(isRechazada);
    const favoritosList = list.filter(s => isFavItem(s.id));
    const tabs = [
        { key: 'pendientes', label: 'Pendientes por Aprobar', data: pendientesList },
        { key: 'aprobadas', label: 'Aprobadas', data: aprobadasList },
        { key: 'rechazadas', label: 'Rechazadas', data: rechazadasList }
    ];
    if (favoritosList.length > 0) {
        tabs.unshift({ key: 'favoritos', label: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" class="inline mb-0.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> Favoritos', data: favoritosList });
    }
    
    if (!tabs.some(t => t.key === solicitudesTab)) solicitudesTab = tabs[0].key;
    list = tabs.find(t => t.key === solicitudesTab).data;

    list.sort((a, b) => {
        const aPinned = isPinnedItem(a.id) ? 1 : 0;
        const bPinned = isPinnedItem(b.id) ? 1 : 0;
        if (aPinned !== bPinned) return bPinned - aPinned;
        const aFav = isFavItem(a.id) ? 1 : 0;
        const bFav = isFavItem(b.id) ? 1 : 0;
        if (aFav !== bFav) return bFav - aFav;
        
        const valA = (item) => {
            if (sortSolicitudes.includes('criticidad')) {

                if (c === 'Alta') return 3;

                return 0;

            return new Date(item.creadoEl || 0).getTime();

// Helper: read file as base64 data URL
function readFileAsDataURL(file) {
    return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = (e) => resolve({ name: file.name, type: file.type, data: e.target.result });
        reader.readAsDataURL(file);
    });
}

// Helper: abre un documento almacenado en Supabase Storage (URL pública) directamente en el navegador,
// sin forzar la descarga. Word/Excel/PowerPoint se visualizan con el visor de Office Online; las
// imágenes se envuelven en una página propia para poder desalentar el clic derecho (ver arriba);
// el resto (PDFs, etc.) los renderiza el navegador de forma nativa al abrirlos en una pestaña nueva.
// Usada para los documentos del EXPEDIENTE (estudios, referencias laborales) y reportes del
// sistema, donde sí se permite que el visor nativo del navegador ofrezca su propia descarga.
function openStoredFileUrl(url, isOwner = false) {
    if (!url) return showToast('Archivo no disponible.', 'error');
    if (/\.(jpe?g|png|gif|webp|bmp|svg)(\?.*)?$/i.test(url)) {
        if (isOwner) window.open(url, '_blank');
        else abrirImagenInterna(url, 'Documento');
    } else if (/\.pdf(\?.*)?$/i.test(url)) {
        if (isOwner) window.open(url, '_blank');
        else abrirPdfInterno(url, 'Documento');
    } else if (/\.(docx?|xlsx?|pptx?)(\?.*)?$/i.test(url)) {
        window.open('https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(url), '_blank');
    } else {
        window.open(url, '_blank');
    }
}

// Carga pdf.js (servido localmente desde /vendor/pdfjs, no un CDN externo) solo la primera vez que
// se abre un PDF, para no cargar ~1.7MB de JS en cada visita a la app.
let _pdfjsLibPromise = null;
function cargarPdfjs() {
    if (!_pdfjsLibPromise) {
        _pdfjsLibPromise = import('/vendor/pdfjs/pdf.min.mjs').then(lib => {
            lib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs';
            return lib;
        });
    }
    return _pdfjsLibPromise;
}

// Visor de PDF 100% interno: renderiza cada página como píxeles en un <canvas> propio, en vez de
// abrir el visor nativo del navegador (que trae su propio botón de descarga/impresión en la
// barra de herramientas). Deliberadamente NO incluye la capa de texto seleccionable de pdf.js,
// para no facilitar copiar/extraer el contenido. Como el <canvas> se pinta con fetch() hecho por
// nuestra propia página (no una navegación directa a la URL del archivo), no hay "Guardar como"
// nativo del navegador apuntando al PDF.
async function abrirPdfInterno(url, nombre) {
    const overlay = document.createElement('div');
    overlay.id = 'pdfViewerOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:#0f172a;z-index:9998;display:flex;flex-direction:column;';
    overlay.oncontextmenu = () => false;
    overlay.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.75rem 1.25rem;background:#111827;color:#fff;flex-shrink:0;">
            <span style="font-weight:600;font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${nombre || 'Documento'}</span>
            <div style="display:flex;align-items:center;gap:0.6rem;flex-shrink:0;">
                <button id="pdfPrevBtn" class="btn btn-secondary btn-sm">‹ Anterior</button>
                <span id="pdfPageInfo" style="font-size:0.8rem;color:#cbd5e1;white-space:nowrap;">Cargando…</span>
                <button id="pdfNextBtn" class="btn btn-secondary btn-sm">Siguiente ›</button>
                <button id="pdfCloseBtn" class="btn btn-secondary btn-sm">✕ Cerrar</button>
            </div>
        </div>
        <div id="pdfCanvasWrap" style="flex:1;overflow:auto;display:flex;justify-content:center;padding:1.5rem;" oncontextmenu="return false">
            <canvas id="pdfCanvas" style="box-shadow:0 4px 24px rgba(0,0,0,0.4);height:fit-content;user-select:none;-webkit-user-drag:none;"></canvas>
        </div>`;
    document.body.appendChild(overlay);

    const cerrarVisor = () => { overlay.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc = (e) => { if (e.key === 'Escape') cerrarVisor(); };
    overlay.querySelector('#pdfCloseBtn').onclick = cerrarVisor;
    document.addEventListener('keydown', onEsc);

    try {
        const pdfjsLib = await cargarPdfjs();
        const pdf = await pdfjsLib.getDocument({ url }).promise;
        let currentPage = 1;
        const canvas = overlay.querySelector('#pdfCanvas');
        const pageInfo = overlay.querySelector('#pdfPageInfo');
        const prevBtn = overlay.querySelector('#pdfPrevBtn');
        const nextBtn = overlay.querySelector('#pdfNextBtn');

        async function renderPage(num) {
            const page = await pdf.getPage(num);
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            pageInfo.textContent = `Página ${num} de ${pdf.numPages}`;
            prevBtn.disabled = num <= 1;
            nextBtn.disabled = num >= pdf.numPages;
        }

        prevBtn.onclick = () => { if (currentPage > 1) renderPage(--currentPage); };
        nextBtn.onclick = () => { if (currentPage < pdf.numPages) renderPage(++currentPage); };
        if (pdf.numPages <= 1) { prevBtn.style.visibility = 'hidden'; nextBtn.style.visibility = 'hidden'; }

        await renderPage(currentPage);
    } catch (err) {
        console.error('abrirPdfInterno error:', err);
        overlay.querySelector('#pdfCanvasWrap').innerHTML = `<p style="color:#f87171;align-self:center;">No se pudo cargar el documento.</p>`;
    }
}

// Abre un documento adjunto de un CASO o INCIDENCIA (sustanciación, memorándum de cierre,
// soportes de incidencia) evitando en lo posible que quede descargable: las imágenes usan la vista
// protegida de siempre y los PDF se renderizan con el visor interno (sin botón de descarga nativo).
// Word/Excel/PowerPoint todavía se abren con el visor de Office Online (un iframe de Microsoft que
// no controlamos y sí permite descargar desde ahí) hasta que esos adjuntos se conviertan a PDF en
// el servidor. Los documentos del EXPEDIENTE (estudios, referencias) NO pasan por aquí — siguen
// usando openStoredFileUrl con descarga permitida.
function abrirDocumentoCaso(url, nombre, isOwner = false) {
    if (!url) return showToast('Archivo no disponible.', 'error');
    if (/\.(jpe?g|png|gif|webp|bmp|svg)(\?.*)?$/i.test(url)) {
        if (isOwner) {
            window.open(url, '_blank');
        } else {
            abrirImagenInterna(url, nombre);
        }
    } else if (/\.pdf(\?.*)?$/i.test(url)) {
        if (isOwner) {
            window.open(url, '_blank');
        } else {
            abrirPdfInterno(url, nombre);
        }
    } else if (/\.(docx?|xlsx?|pptx?)(\?.*)?$/i.test(url)) {
        window.open('https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(url), '_blank');
    } else {
        window.open(url, '_blank');
    }
}

// Helper: download a stored file object
function downloadFile(fileObj) {
    if (!fileObj || !fileObj.data) return showToast('Archivo no disponible.', 'error');
    const a = document.createElement('a');
    a.href = fileObj.data;
    a.download = fileObj.name;
    a.click();
}

// Helper: preview a stored file object (images inline, others download)
function previewFile(fileObj, isOwner = false) {
    if (!fileObj || !fileObj.data) return showToast('Archivo no disponible.', 'error');
    if (fileObj.type && fileObj.type.startsWith('image/')) {
        if (isOwner) {
            downloadFile(fileObj);
        } else {
            abrirImagenInterna(fileObj.data, fileObj.name);
        }
    } else if (fileObj.type === 'application/pdf') {
        if (isOwner) {
            downloadFile(fileObj);
        } else {
            abrirPdfInterno(fileObj.data, fileObj.name);
        }
    } else {
        downloadFile(fileObj);
    }
}

async function crearSolicitud(e) {
    e.preventDefault();
    if (!validarFormulario(e.target)) return;
    const btn = e.target.querySelector('button[type="submit"]');
    if (!lockAction(btn)) return;
    try { await waitForUndo("Enviando solicitud..."); } catch(err) { unlockAction(btn); return; }

    try {
        const f1 = document.getElementById('solXls').files[0];
        const f2 = document.getElementById('solPpt').files[0];
        const [adj1, adj2] = await Promise.all([readFileAsDataURL(f1), readFileAsDataURL(f2)]);

        let url1 = null;
        let url2 = null;

        if (adj1 && f1) {
            const u1Res = await fetch('/api/upload', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fileBase64: adj1, fileName: f1.name}) });
            if(u1Res.ok) url1 = (await u1Res.json()).url;
        }
        if (adj2 && f2) {
            const u2Res = await fetch('/api/upload', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fileBase64: adj2, fileName: f2.name}) });
            if(u2Res.ok) url2 = (await u2Res.json()).url;
        }

        const payload = {
            tipo_solicitud: document.getElementById('solAsunto').value,
            criticidad: document.getElementById('solCrit').value,
            estatus: ESTADOS_SOLICITUD.REVISION_GERENTE,
            solicitante_id: currentUser.id,
            detalle: 'Nueva solicitud registrada.',
            documento_1: url1,
            documento_2: url2,
            created_at: new Date().toISOString()
        };

        const res = await fetch('/api/db/solicitudes_especialistas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            return uiAlert("Error al conectar con la base de datos.");
        }

        const json = await res.json();
        const newRow = json.data[0];
        const solId = newRow.id_solicitud; // Auto-generated ID from Supabase

        db.solicitudes.push({
            id: solId,
            asunto: newRow.tipo_solicitud,
            criticidad: newRow.criticidad || 'Alta',
            estado: newRow.estatus,
            creadoPor: currentUser.username,
            creadoEl: newRow.created_at,
            detalle: newRow.detalle,
            adjuntos: { xls: newRow.documento_1 || null, ppt: newRow.documento_2 || null },
            casoGenerado: null
        });

        notifyUser(ROLES.GERENTE, `Nueva Solicitud ${solId} requiere tu aprobación.`, { view: 'solicitud-detail', params: { id: solId } }, true);
        navigate('solicitudes');
        showToast(`Solicitud ${solId} creada exitosamente y enviada a Gerencia para aprobación.`, 'success');
        refreshInBackground();
    } catch (err) {
        uiAlert("Error al conectar con la base de datos.");
    } finally {
        unlockAction(btn);
    }
}

function renderSolicitudDetail(id) {
    const s = db.solicitudes.find(x => x.id == id);
    if(!s.vistasPor) s.vistasPor = [];
    if(!s.vistasPor.includes(currentUser.username)) {
        s.vistasPor.push(currentUser.username);
        saveDB();
    }

    // Determine if current user is the creator (they can't approve their own)
    const isCreator = s.creadoPor === currentUser.username;
    const showActions = !isCreator || hasPermission('apruebo_incidencias');

    // Build action panel
    let actions = `<p class="text-muted text-sm">Sin acciones disponibles para tu rol en el estado actual.</p>`;
    
    if (s.estado === ESTADOS_SOLICITUD.REVISION_GERENTE) {

function checkAutoAddPersonaSol(val, solId) {
    const cedula = val.trim();
    if(!cedula) return;
    const p = db.personas.find(x => x.cedula === cedula);
    const s = db.solicitudes.find(x => x.id === solId);
    if(!s.personasInvolucradas) s.personasInvolucradas = [];

    if(!p) {
        showToast(`Cédula ${cedula} no encontrada en el Directorio de Trabajadores.`, 'error');
        return;
    }
    if(s.personasInvolucradas.includes(cedula)) {
        showToast(`${p.nombre} ya está vinculado a esta solicitud.`, 'warning');
        return;
    }
    s.personasInvolucradas.push(cedula);
    saveDB();
    showToast(`${p.nombre} vinculado correctamente.`, 'success');
    navigate('solicitud-detail', {id: solId});
}

function eliminarPersonaSol(solId, cedula) {
    const s = db.solicitudes.find(x => x.id === solId);
    if(s && s.personasInvolucradas) {
        s.personasInvolucradas = s.personasInvolucradas.filter(x => x !== cedula);
        saveDB();
        navigate('solicitud-detail', {id: solId});
    }
}
function escalarSolicitud(id, nextState, nextUser, msjNotif) {
    const s = db.solicitudes.find(x => x.id == id);
    const obsVal = document.getElementById('solObs') ? document.getElementById('solObs').value.trim() : '';
    if (obsVal) {
        if (!s.observaciones) s.observaciones = [];
        s.observaciones.push({ autor: currentUser.name, texto: obsVal });
    }
    s.estado = nextState; s.asignadoA = nextUser;
    saveDB();
    notifyUser(nextUser, `Escalamiento Solicitud ${id}: ${msjNotif}`, { view: 'solicitud-detail', params: { id } });
    showToast(`Acción registrada: ${msjNotif}`, 'success');
    navigate('solicitudes');
}

async function aprobarSolicitudGerente(id) {
    const btn = event && event.currentTarget ? event.currentTarget : null;
    if (!lockAction(btn)) return;
    try { await waitForUndo("Aprobando solicitud y creando caso..."); } catch(e) { unlockAction(btn); return; }
    try {
    const s = db.solicitudes.find(x => x.id == id);
    const obsVal = document.getElementById('solObs') ? document.getElementById('solObs').value.trim() : '';

    // Create the case
    let creadorId = currentUser.id;
    let originalUser = db.users.find(u => u.username === s.creadoPor);
    if (originalUser) creadorId = originalUser.id;

    let coordAssignId = null;
    if (originalUser && originalUser.region) {
        const coordUser = db.users.find(u => String(u.role).toLowerCase().includes('coordinador') && u.region === originalUser.region);
        if (coordUser) coordAssignId = coordUser.id || coordUser.username;
    }

    const casoPayload = {
        numero_ticket: parseInt(id),
        denunciante_id: creadorId,
        descripcion_hechos: s.asunto,
        fecha_incidente: s.creadoEl,
        coordinador_asignado: coordAssignId,
        estatus: ESTADOS_CASO.PENDIENTE_COORD
    };

    // Post new case
    const res = await fetch('/api/db/investigaciones', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(casoPayload)
    });
    if(!res.ok) return showToast('Error al crear el caso.', 'error');
    const newCaso = (await res.json()).data[0];
    const newCasoId = newCaso.id_investigacion;

    // Update solicitud
    await fetch(`/api/db/solicitudes_especialistas/id_solicitud/${id}`, {
        method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ estatus: 'APROBADO' })
    });

    if (obsVal) {
        await fetch('/api/db/casos_comentarios', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ investigacion_id: newCasoId, autor_id: currentUser.id, texto: obsVal, fecha: new Date().toISOString() })
        });
    }

    await fetch('/api/db/casos_estado_historial', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ investigacion_id: newCasoId, estado_anterior: 'N/A', estado_nuevo: ESTADOS_CASO.PENDIENTE_COORD, fecha_cambio: new Date().toISOString(), usuario_id: currentUser.id })
    });

    const coordName = coordAssignId ? (db.users.find(u => u.id === coordAssignId || u.username === coordAssignId)?.username || null) : null;
    const newCasoObj = {
        id: newCasoId,
        solicitudRef: parseInt(id),
        incidenciaOrigen: newCaso.numero_ticket,
        asunto: newCaso.descripcion_hechos,
        estado: newCaso.estatus,
        creadorOriginal: originalUser ? originalUser.username : s.creadoPor,
        asignadoA: null,
        coordinadorAsignado: coordName,
        supervisorAsignado: null,
        especialistaAsignado: null,
        fechaApertura: newCaso.created_at,
        fechaLimite: null,
        planTrabajo: null,
        sustanciacion: null,
        memoFinal: null,
        personasInvolucradas: [],
        implicaciones: {},
        estadoLog: [{ estado_anterior: 'N/A', estado_nuevo: ESTADOS_CASO.PENDIENTE_COORD, fecha_cambio: new Date().toISOString(), usuario_id: currentUser.id }],
        historialMensajes: obsVal ? [{ autor: currentUser.name, texto: obsVal, fecha: new Date().toLocaleString('es-VE', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}), ts: Date.now() }] : [],
        estadoUpdateMs: Date.now()
    };
    newCasoObj.asignadoA = computeAsignado(newCasoObj);
    db.casos.push(newCasoObj);
    s.estado = 'APROBADO';
    s.casoGenerado = newCasoId;

    showToast(`Incidencia aprobada. Caso ${newCasoId} asignado al Coordinador.`, 'success');
    navigate('solicitudes');
    refreshInBackground();
    } finally {
        unlockAction(btn);
    }
}

async function rechazarSolicitudGerente(id) {
    const btn = event && event.currentTarget ? event.currentTarget : null;
    const obs = document.getElementById('solObs') ? document.getElementById('solObs').value.trim() : '';
    if (!obs) return uiAlert('Debe escribir el motivo del rechazo antes de rechazar.');
    if (!lockAction(btn)) return;
    try { await waitForUndo("Rechazando solicitud..."); } catch(err) { unlockAction(btn); return; }

    try {
        const s = db.solicitudes.find(x => x.id == id);
        const nuevoDetalle = s.detalle + `\n\n[RECHAZO]: ${obs}`;

        // No existe tabla de comentarios para solicitudes en el esquema de la DB, así que el motivo
        // de rechazo (la corrección que debe atender el solicitante) se guarda dentro de 'detalle'.
        await fetch(`/api/db/solicitudes_especialistas/id_solicitud/${id}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ estatus: 'RECHAZADO', detalle: nuevoDetalle })
        });

        // Una incidencia rechazada NO abre un caso: sus adjuntos quedan archivados como documentación
        // (tabla 'documents', igual que los reportes mensuales) para no perder el registro del rechazo.
        const adjuntosRechazo = [s.adjuntos?.xls, s.adjuntos?.ppt].filter(Boolean);
        for (const ruta of adjuntosRechazo) {
            await fetch('/api/db/documents', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    persona_id: null,
                    ruta,
                    tipo_documento: 'incidencia_rechazada',
                    nombre_original: `Incidencia ${id} (Rechazada) — ${s.asunto}`.slice(0, 190),
                    hash_name: `incidencia_rechazada_${id}`
                })
            });
        }

        s.estado = 'RECHAZADO';
        s.detalle = nuevoDetalle;
        notifyUser(s.creadoPor, `Tu Incidencia ${id} fue RECHAZADA por Gerencia: ${obs}`, { view: 'solicitud-detail', params: { id } });
        showToast(`Incidencia ${id} rechazada. Se notificó al solicitante.`, 'error');
        navigate('solicitudes');
        refreshInBackground();
    } finally {
        unlockAction(btn);
    }
}


// --- CASOS (EXPEDIENTES OFICIALES) ---


function getTimeInState(updateMs) {
    if (!updateMs) return 'Recién llegado';
    const diff = Date.now() - updateMs;
    const mins = Math.floor(diff / 60000);
    const hrs = Math.floor(mins / 60);
    const days = Math.floor(hrs / 24);
    if (days > 0) return `${days} días`;
    if (hrs > 0) return `${hrs} hrs`;
    if (mins > 0) return `${mins} min`;
    return 'Recién llegado';
}

function renderCasos() {
    let list = db.casos;

    if (currentUser.role !== ROLES.GERENTE) {
        list = list.filter(c => 
            c.regionOrigen === currentUser.region || 
            c.asignadoA === currentUser.username || 
            c.coordinadorAsignado === currentUser.username || 
            c.supervisorAsignado === currentUser.username || 
            c.especialistaAsignado === currentUser.username ||
            c.creadorOriginal === currentUser.username
        );
    }

    // Filter out closed cases older than 3 days (only for Kanban or general visibility)
    const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
    list = list.filter(c => {
        if (c.estado === ESTADOS_CASO.CERRADO) {
            return (Date.now() - c.estadoUpdateMs) <= THREE_DAYS_MS;
        }
        return true;
    });
    
    list.sort((a, b) => new Date(b.fechaApertura).getTime() - new Date(a.fechaApertura).getTime());

    if (hasPermission('cerrar_caso')) {
        // GERENTE: KANBAN BOARD
        const columns = [
            ESTADOS_CASO.PENDIENTE_COORD,
            ESTADOS_CASO.PENDIENTE_SUPER,
            ESTADOS_CASO.PENDIENTE,
            ESTADOS_CASO.SUSTANCIACION,
            'Revisión',
            ESTADOS_CASO.CERRADO
        ];
        let html = `<div class="flex flex-col h-full w-full">
            <div class="page-header">
                <h1 class="page-title">Casos Activos</h1>
            </div>
            <div class="kanban-board">`;
            
        columns.forEach(colName => {
            let colCases;
            if (colName === 'Revisión') {
                colCases = list.filter(c => 
                    c.estado === ESTADOS_CASO.REVISION_SUPERVISOR || 
                    c.estado === ESTADOS_CASO.REVISION_COORDINADOR || 
                    c.estado === ESTADOS_CASO.REVISION_GERENCIA
                );
            } else {
                colCases = list.filter(c => c.estado === colName);
            }
            
            let phaseStyle = '';
            let badgeStyle = '';
            
            if (colName.includes('Planificación') || colName.includes('Asignación')) {
                phaseStyle = 'background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border-bottom: 2px solid #3b82f6; color: #1e3a8a;';
                badgeStyle = 'background: rgba(59,130,246,0.15); color: #1d4ed8;';
            } else if (colName.includes('Pendiente')) {
                phaseStyle = 'background: linear-gradient(135deg, #ecfeff 0%, #cffafe 100%); border-bottom: 2px solid #06b6d4; color: #164e63;';
                badgeStyle = 'background: rgba(6,182,212,0.15); color: #0e7490;';
            } else if (colName.includes('Sustanciación')) {
                phaseStyle = 'background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-bottom: 2px solid #f59e0b; color: #78350f;';
                badgeStyle = 'background: rgba(245,158,11,0.2); color: #b45309;';
            } else if (colName.includes('Revisión')) {
                phaseStyle = 'background: linear-gradient(135deg, #fdf4ff 0%, #fae8ff 100%); border-bottom: 2px solid #d946ef; color: #701a75;';
                badgeStyle = 'background: rgba(217,70,239,0.15); color: #a21caf;';
            } else if (colName.includes('Cerrado')) {
                phaseStyle = 'background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); border-bottom: 2px solid #10b981; color: #064e3b;';
                badgeStyle = 'background: rgba(16,185,129,0.15); color: #047857;';
            } else {
                phaseStyle = 'background: #f8fafc; border-bottom: 2px solid var(--glass-border); color: var(--text-primary);';
                badgeStyle = 'background: var(--glass-border); color: var(--text-secondary);';
            }

            html += `<div class="kanban-col">
                <div class="kanban-header" style="${phaseStyle}">${colName} <span class="badge" style="border:none; ${badgeStyle}">${colCases.length}</span></div>
                <div class="kanban-cards">`;
                
            colCases.forEach(c => {
                html += `<div class="kanban-card glass-card">
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-gradient-fuchsia font-mono">${c.id}</span>
                        <span class="badge badge-low" style="font-size:0.6rem; padding: 2px 6px; display:flex; align-items:center; gap:0.25rem;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            ${getTimeInState(c.estadoUpdateMs)}
                        </span>
                    </div>
                    <p class="text-xs mb-3 text-secondary" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${c.asunto}</p>
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-muted flex items-center gap-2">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            ${c.asignadoA}

                        <button class="btn btn-secondary" style="padding: 0.2rem 0.6rem; font-size: 0.75rem;" onclick="navigate('case-detail', {id:'${c.id}'})">Ver</button>
                    </div>
                </div>`;
            });
            html += `</div></div>`;
        });
        return html + `</div></div>`;
    } else {
        // OTROS ROLES: BANDEJA DE TRABAJO
        let myCases = [];
        let trackedCases = [];
        let pendingApprovalCases = [];
        
        if (currentUser.role === ROLES.ESP) {
            // Especialista: solo lo asignado a él donde tenga acciones
            myCases = list.filter(c => c.asignadoA === currentUser.username);
            // El resto de sus casos van a seguimiento
            trackedCases = list.filter(c => c.especialistaAsignado === currentUser.username && !myCases.includes(c));
            // Casos recién creados pendientes por aprobar en niveles superiores
            pendingApprovalCases = list.filter(c => c.creadorOriginal === currentUser.username && (c.estado === ESTADOS_CASO.PENDIENTE_COORD || c.estado === ESTADOS_CASO.PENDIENTE_SUPER));
        } else if (currentUser.role === ROLES.SUPER || currentUser.role === ROLES.COORD) {
            // Todos los casos de la región
            const myRegionUsers = db.users.filter(u => u.region === currentUser.region).map(u => u.username);
            
            const regionCases = list.filter(c => 
                myRegionUsers.includes(c.especialistaAsignado) || 
                myRegionUsers.includes(c.coordinadorAsignado) || 
                myRegionUsers.includes(c.supervisorAsignado) || 
                myRegionUsers.includes(c.creadorOriginal) ||
                c.asignadoA === currentUser.username ||
                c.asignadoA === currentUser.role ||
                c.asignadoA === 'coord' || c.asignadoA === 'admin'
            );

            // myCases solo donde TIENE que tomar accion ahora mismo
            myCases = regionCases.filter(c => {
                if (c.asignadoA === currentUser.username) return true;
                if (currentUser.role === ROLES.SUPER) {
                    return c.asignadoA === 'admin' || c.asignadoA === ROLES.SUPER ||
                           (c.supervisorAsignado === currentUser.username && (c.estado === ESTADOS_CASO.PENDIENTE_SUPER || c.estado === ESTADOS_CASO.REVISION_SUPERVISOR));
                }
                if (currentUser.role === ROLES.COORD) {
                    return c.asignadoA === 'coord' || c.asignadoA === ROLES.COORD || 
                           (c.coordinadorAsignado === currentUser.username && (c.estado === ESTADOS_CASO.PENDIENTE_COORD || c.estado === ESTADOS_CASO.REVISION_COORDINADOR));
                }
                return false;
            });
            
            // trackedCases es el resto (para que no se sature la principal, pero no pierdan seguimiento)
            trackedCases = regionCases.filter(c => !myCases.includes(c));
        }

        const renderTable = (cases, showAction, tableId) => {
            if (cases.length === 0) return `<p class="p-6 text-center text-muted">No hay casos en esta bandeja.</p>`;
            
            cases.sort((a, b) => {
                const aPinned = isPinnedItem(a.id) ? 1 : 0;
                const bPinned = isPinnedItem(b.id) ? 1 : 0;
                if (aPinned !== bPinned) return bPinned - aPinned;
                const aFav = isFavItem(a.id) ? 1 : 0;
                const bFav = isFavItem(b.id) ? 1 : 0;
                if (aFav !== bFav) return bFav - aFav;
                
                const valA = (item) => {
                    if (sortCasos.includes('criticidad')) {
                        let crit = null;
                        if (item.solicitudRef) {
                            const sol = db.solicitudes.find(s => s.id == item.solicitudRef);
                            if (sol) crit = sol.criticidad;
                        }
                        if (crit === 'Alta') return 3;
                        if (crit === 'Media') return 2;
                        if (crit === 'Baja') return 1;
                        return 0;
                    }
                    return new Date(item.estadoUpdateMs || item.fechaApertura || 0).getTime();
                };
                if (sortCasos === 'reciente') return valA(b) - valA(a);
                if (sortCasos === 'antiguo') return valA(a) - valA(b);
                if (sortCasos === 'criticidad-desc') return valA(b) - valA(a) || (new Date(b.estadoUpdateMs || b.fechaApertura || 0).getTime() - new Date(a.estadoUpdateMs || a.fechaApertura || 0).getTime());
                if (sortCasos === 'criticidad-asc') return valA(a) - valA(b) || (new Date(b.estadoUpdateMs || b.fechaApertura || 0).getTime() - new Date(a.estadoUpdateMs || a.fechaApertura || 0).getTime());
                return 0;
            });

            let html = `<table id="${tableId}" class="table-container m-0">
                <thead><tr class="table-header"><th style="width: 80px;">ID</th><th style="min-width: 180px; max-width: 350px; overflow-wrap: break-word;">Asunto</th><th style="width: 120px; min-width: 110px; text-align: center;">Estado</th><th>Responsable</th><th style="text-align:right">
                    <div class="table-sort-dropdown" onclick="this.classList.toggle('open'); event.stopPropagation();">
                        <button class="table-sort-btn" style="display: flex; align-items: center; gap: 4px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--cantv-fuchsia)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px;"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                            ${sortCasos==='reciente'?'Recientes':sortCasos==='antiguo'?'Antiguos':sortCasos==='criticidad-desc'?'Criticidad (Alta)':'Criticidad (Baja)'}
                        </button>
                        <div class="table-sort-menu">
                            <div class="table-sort-item ${sortCasos==='reciente'?'active':''}" onclick="setSort('reciente', 'casos')" style="display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg> Orden: Recientes</div>
                            <div class="table-sort-item ${sortCasos==='antiguo'?'active':''}" onclick="setSort('antiguo', 'casos')" style="display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg> Orden: Antiguos</div>
                            <div class="table-sort-item ${sortCasos==='criticidad-desc'?'active':''}" onclick="setSort('criticidad-desc', 'casos')" style="display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg> Orden: Criticidad</div>
                            <div class="table-sort-item ${sortCasos==='criticidad-asc'?'active':''}" onclick="setSort('criticidad-asc', 'casos')" style="display: flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg> Orden: Criticidad</div>
                        </div>
                    </div>
                </th></tr></thead><tbody>`;
            cases.forEach(c => {
                const isPinned = isPinnedItem(c.id);
                const isFav = isFavItem(c.id);
                html += `<tr class="table-row ${isPinned ? 'bg-fuchsia-50' : ''}" oncontextmenu="handleRowRightClick(event)">
                    <td class="font-bold" style="position: relative;">
                        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 190px; overflow: hidden; pointer-events: none; z-index: 20;">
                            <div class="row-context-menu flex items-center gap-3 pr-3">
                                <button class="btn btn-secondary btn-sm flex items-center justify-center" title="Anclar" onclick="togglePinItem('caso', '${c.id}')" style="background: #e5e7eb; border: 1px solid #d1d5db; padding: 0.4rem; border-radius: 6px; color: ${isPinned ? 'var(--cantv-fuchsia)' : 'inherit'};">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="${isPinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
                                </button>
                                <button class="btn btn-secondary btn-sm flex items-center justify-center" title="Favorito" onclick="toggleFavItem('caso', '${c.id}')" style="background: #e5e7eb; border: 1px solid #d1d5db; padding: 0.4rem; border-radius: 6px; color: ${isFav ? '#fbbf24' : 'inherit'};">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                </button>
                                <button class="btn btn-secondary btn-sm" title="Cerrar" onclick="closeRowMenu(event)" style="padding: 0.4rem; margin-left: auto; background: transparent; border: none; font-size: 1.2rem; color: #fff;">×</button>
                            </div>
                        </div>
                        <div class="row-main-content flex items-center mt-1" style="gap: 6px;">
                            ${isPinned ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-cantv-fuchsia flex-shrink-0"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>' : ''}
                            ${isFav ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" class="flex-shrink-0" style="color:#fbbf24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>' : ''}
                            <span class="text-gradient-fuchsia font-mono" style="font-size: 0.9rem; transform: translateY(1px);">${c.id}</span>
                        </div>
                    </td>
                    <td>${formatAsunto(c.asunto)}</td>
                    <td><span class="badge badge-low">${c.estado}</span></td>
                    <td>${c.asignadoA}</td>
                    <td><button class="btn btn-secondary btn-sm" onclick="navigate('case-detail', {id:'${c.id}'})">${showAction ? 'Procesar' : 'Ver'}</button></td>
                </tr>`;
            });
            return html + `</tbody></table>`;
        };

        const tabs = [
            { key: 'accion', label: 'Requieren tu Acción', data: myCases, showAction: true },
            { key: 'seguimiento', label: 'En Seguimiento', data: trackedCases, showAction: false }
        ];
        if (currentUser.role === ROLES.ESP) {
            tabs.push({ key: 'pendientes', label: 'Pendiente por Aprobar', data: pendingApprovalCases, showAction: false });
        }
        
        const favCases = list.filter(c => isFavItem(c.id));
        if (favCases.length > 0) {
            tabs.unshift({ key: 'favoritos', label: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" class="inline mb-0.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg> Favoritos', data: favCases, showAction: true });
        }
        
        if (!tabs.some(t => t.key === casosBandejaTab)) casosBandejaTab = tabs[0].key;
        const currentTab = tabs.find(t => t.key === casosBandejaTab);

        return `<div class="view-enter max-w-5xl">
            <div class="page-header" style="align-items: center; margin-bottom: 1.5rem;">
                <h1 class="page-title">Casos Activos</h1>
                <div class="flex gap-4 items-stretch">
                    <input type="text" class="input-field search-input" placeholder="Buscar por ID o Asunto..." onkeyup="filterTable('casosBandejaTable', this.value)" maxlength="50">
                </div>
            </div>
            
            <div class="flex gap-2 mb-4 tabs-wrapper">
                ${tabs.map(t => `<button class="btn ${casosBandejaTab === t.key ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setCasosBandejaTab('${t.key}')">${t.label} <span class="badge" style="margin-left:0.4rem;background:${casosBandejaTab === t.key ? 'rgba(255,255,255,0.25)' : 'var(--glass-bg-strong)'}">${t.data.length}</span></button>`).join('')}
            </div>
            
            <div class="glass-card p-0 mb-8">${renderTable(currentTab.data, currentTab.showAction, 'casosBandejaTable')}</div>
        </div>`;
    }
}

let pendingInvolucradosAdd = [];
let pendingInvolucradosRemove = [];
let isSubmitting = false;
// Bloqueo global: mientras haya una acción en curso (cualquier botón que llame lockAction),
// no se permite iniciar otra ni cerrar sesión. Ver logout().
function lockAction(btn, label = 'Procesando...') {
    if (isSubmitting) return false;
    isSubmitting = true;
    if (btn) {
        btn.disabled = true;
        if (btn.dataset.origHtml === undefined) btn.dataset.origHtml = btn.innerHTML;
        btn.innerHTML = `<span class="btn-spinner"></span>${label}`;
    }
    return true;
}
function unlockAction(btn) {
    isSubmitting = false;
    if (btn) {
        btn.disabled = false;
        if (btn.dataset.origHtml !== undefined) { btn.innerHTML = btn.dataset.origHtml; delete btn.dataset.origHtml; }
    }
}

function renderInvolucradosView(id) {
    const c = db.casos.find(x => x.id == id);
    let finalInvolucrados = [...c.personasInvolucradas];
    
    // Apply pending changes
    finalInvolucrados = finalInvolucrados.filter(ced => !pendingInvolucradosRemove.includes(ced));
    pendingInvolucradosAdd.forEach(add => {
        if (!finalInvolucrados.includes(add.cedula)) finalInvolucrados.push(add.cedula);
    });

    if (finalInvolucrados.length === 0) return `<p class="text-sm text-muted mb-2">Nadie vinculado aún.</p>`;

    return `<div class="mb-2">` +
        finalInvolucrados.map(ced => {
            const p = db.personas.find(x => x.cedula === ced);
            const name = p ? p.nombre : ced;
            let grado = (c.implicaciones && c.implicaciones[ced]) || 'No Definido';
            const pendingAdd = pendingInvolucradosAdd.find(a => a.cedula === ced);
            if (pendingAdd) grado = pendingAdd.grado;

            const isPending = (pendingAdd || pendingInvolucradosRemove.includes(ced)) ? ' pending' : '';
            const initial = (name || '?').charAt(0).toUpperCase();
            const deleteBtn = c.estado === ESTADOS_CASO.SUSTANCIACION ?
                `<button type="button" class="involucrado-remove" title="Quitar" onclick="eliminarPersonaVisual('${c.id}', '${ced}')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>` : '';
            return `<div class="involucrado-row${isPending}">
                <div class="involucrado-avatar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="involucrado-info">
                    <div class="involucrado-name truncate" title="${name}">${name}</div>
                    <div class="involucrado-meta">${ced}</div>
                </div>
                <span class="badge badge-fuchsia involucrado-grado">${grado}</span>
                ${deleteBtn}
            </div>`;
        }).join('') + `</div>`;
}

function renderCaseDetail(id) {
    pendingInvolucradosAdd = [];
    pendingInvolucradosRemove = [];
    const c = db.casos.find(x => x.id == id);
    
    let involucradosHtml = `<div id="involucrados-wrapper">${renderInvolucradosView(id)}</div>`;

    // Build horizontal timeline with click-to-pin tooltips including historial messages
    let actividadHtml = '';
    {
        const phases = [
            { name: 'Planificación', states: [ESTADOS_CASO.PENDIENTE_COORD] },
            { name: 'Asignación',    states: [ESTADOS_CASO.PENDIENTE_SUPER] },
            { name: 'Sustanciación', states: [ESTADOS_CASO.PENDIENTE, ESTADOS_CASO.SUSTANCIACION] },
            { name: 'Revisión',      states: [ESTADOS_CASO.REVISION_SUPERVISOR, ESTADOS_CASO.REVISION_COORDINADOR, ESTADOS_CASO.REVISION_GERENCIA] },
            { name: 'Cerrado',       states: [ESTADOS_CASO.CERRADO] }
        ];
        let currentIndex = phases.findIndex(p => p.states.includes(c.estado));
        if (currentIndex === -1) currentIndex = 0;

        // Group historial messages by phase (based on timestamp ranges from estadoLog)
        const phaseMsgs = phases.map(() => []);
        if (c.historialMensajes && c.historialMensajes.length > 0 && c.estadoLog && c.estadoLog.length > 0) {
            const sortedLogs = [...c.estadoLog].sort((a,b) => new Date(a.fecha_cambio) - new Date(b.fecha_cambio));
            c.historialMensajes.forEach(m => {
                // Subtract 5 seconds (5000ms) to ensure messages created in the same batch as a state transition
                // are grouped into the phase where the action originated, rather than spilling into the new phase.
                const msgTs = (m.ts || new Date(m.fecha).getTime()) - 5000;
                let phaseIdx = 0;
                for (let li = sortedLogs.length - 1; li >= 0; li--) {
                    if (msgTs >= new Date(sortedLogs[li].fecha_cambio).getTime()) {
                        const pi = phases.findIndex(p => p.states.includes(sortedLogs[li].estado_nuevo));
                        if (pi !== -1) phaseIdx = pi;
                        break;
                    }
                }
                phaseMsgs[phaseIdx].push(m);
            });
        } else if (c.historialMensajes && c.historialMensajes.length > 0) {
            // No estadoLog → put all messages under the current phase
            phaseMsgs[currentIndex] = [...c.historialMensajes];
        }

        let stepsHtml = '';
        phases.forEach((phase, i) => {
            const isCompleted = i < currentIndex;
            const isActive = i === currentIndex;
            const isPending = i > currentIndex;
            let startTime = null;
            let endTime = null;
            if (c.estadoLog && c.estadoLog.length > 0) {
                const sorted = [...c.estadoLog].sort((a,b) => new Date(a.fecha_cambio) - new Date(b.fecha_cambio));
                const sIdx = sorted.findIndex(log => phase.states.includes(log.estado_nuevo));
                if (sIdx !== -1) {
                    startTime = new Date(sorted[sIdx].fecha_cambio);
                    for (let j = sIdx + 1; j < sorted.length; j++) {
                        if (!phase.states.includes(sorted[j].estado_nuevo)) {
                            endTime = new Date(sorted[j].fecha_cambio);
                            break;
                        }
                    }
                } else if (i === 0) {
                    startTime = new Date(c.fechaApertura);
                }
            } else if (i === 0) {
                startTime = new Date(c.fechaApertura);
            }

            // Build rich tooltip content
            let tip = `<p style="font-weight:700;font-size:0.82rem;margin:0 0 0.35rem;color:${isActive||isCompleted?'#93c5fd':'#94a3b8'};text-align:center;">${phase.name}</p>`;
            
            let responsable = '';
            if (i === 0 && c.coordinadorAsignado) responsable = c.coordinadorAsignado;
            else if (i === 1 && c.supervisorAsignado) responsable = c.supervisorAsignado;
            else if (i === 2 && c.especialistaAsignado) responsable = c.especialistaAsignado;
            
            // Only show responsable if the phase is NOT completed (avoid redundancy with messages below)
            if (responsable && !isCompleted) {
                tip += `<p style="font-size:0.7rem;color:#cbd5e1;margin:0 0 0.2rem;">Responsable: <span style="color:#fff;font-weight:600;">${responsable}</span></p>`;
            }

            const formatDuration = (ms) => {
                if (ms < 60000) return 'menos de 1m';
                const d = Math.floor(ms / 86400000);
                const h = Math.floor((ms % 86400000) / 3600000);
                const m = Math.floor((ms % 3600000) / 60000);
                if (d > 0) return `${d}d ${h}h`;
                if (h > 0) return `${h}h ${m}m`;
                return `${m}m`;
            };

            if (i === 4 && isActive) {
                const startStr = startTime ? startTime.toLocaleString('es-VE', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
                if (startStr) tip += `<p style="font-size:0.7rem;color:#10b981;margin:0 0 0.3rem;font-weight:600;">Cerrado el: ${startStr}</p>`;
            } else if (isCompleted) {
                const durStr = (startTime && endTime) ? formatDuration(endTime - startTime) : '';
                if (durStr) tip += `<p style="font-size:0.7rem;color:#93c5fd;margin:0 0 0.3rem;font-weight:600;">Tiempo tomado: ${durStr}</p>`;
            } else if (isActive) {
                const durStr = startTime ? formatDuration(new Date() - startTime) : '';
                tip += `<p style="font-size:0.7rem;color:#fbbf24;margin:0 0 0.3rem;">En Proceso ${durStr ? `(lleva ${durStr})` : ''}</p>`;
            } else if (isPending) {
                tip += `<p style="font-size:0.7rem;color:#94a3b8;margin:0;">Fase Pendiente</p>`;
            }

            // Add historial messages for this phase
            const msgs = phaseMsgs[i];
            if (msgs.length > 0) {
                tip += `<div style="border-top:1px solid rgba(255,255,255,0.15);margin-top:0.45rem;padding-top:0.45rem;">`;
                msgs.forEach(m => {
                    tip += `<div style="margin-bottom:0.45rem;"><p style="font-size:0.65rem;color:#93c5fd;font-weight:600;margin:0;">${m.autor}</p><p style="font-size:0.62rem;color:#94a3b8;margin:0 0 0.15rem;">${m.fecha}</p><p style="font-size:0.68rem;color:#e2e8f0;margin:0;line-height:1.35;">${m.texto}</p></div>`;
                });
                tip += `</div>`;
            }

            let circleContent = '', circleStyle = '';
            if (isCompleted) { circleContent = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`; circleStyle = `background:var(--cantv-blue-base);color:white;border:2px solid var(--cantv-blue-base);`; }
            else if (isActive) { circleContent = `${i+1}`; circleStyle = `background:white;color:var(--cantv-blue-base);border:2px solid var(--cantv-blue-base);box-shadow:0 0 0 4px rgba(37,99,235,0.16);`; }
            else { circleContent = `${i+1}`; circleStyle = `background:white;color:var(--text-muted);border:2px solid var(--glass-border);`; }
            const labelStyle = isActive ? `color:var(--cantv-blue-base);font-weight:700;` : isCompleted ? `color:var(--text-primary);font-weight:600;` : `color:var(--text-muted);font-weight:600;`;
            const hasMsgs = msgs.length > 0;
            const dotHtml = hasMsgs ? `<span style="position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--cantv-fuchsia);border-radius:50%;border:1.5px solid white;"></span>` : '';

function updateFileZone(inputId, zoneId, nameId) {
    const input = document.getElementById(inputId);
    const zone = document.getElementById(zoneId);
    const nameEl = document.getElementById(nameId);
    if (input.files && input.files[0]) {
        nameEl.textContent = input.files[0].name;
        zone.classList.add('has-file');
    } else {
        nameEl.textContent = 'Sin archivo seleccionado';
        zone.classList.remove('has-file');
    }
}
async function vincularPersona(casoId) {
    const cedula = document.getElementById('linkCedula').value.trim();
    const grado = document.getElementById('linkGrado').value;
    
    if(!cedula) return showToast('Ingrese una cédula.', 'warning');
    if(!grado) return showToast('Debe seleccionar el grado de implicación.', 'warning');

    const p = db.personas.find(x => x.cedula === cedula);
    if(!p) {
        return showToast(`La cédula ${cedula} no existe. Por favor, registre a esta persona en el Directorio de Expedientes primero.`, 'error');
    }

    const c = db.casos.find(x => x.id == casoId);
    if((c.personasInvolucradas.includes(cedula) || pendingInvolucradosAdd.some(a => a.cedula === cedula)) && !pendingInvolucradosRemove.includes(cedula)) {
        return showToast(`Esta persona ya está vinculada.`, 'info');
    }
    
    pendingInvolucradosAdd.push({ cedula, grado, p_id: p.id });
    pendingInvolucradosRemove = pendingInvolucradosRemove.filter(x => x !== cedula);

    document.getElementById('involucrados-wrapper').innerHTML = renderInvolucradosView(casoId);
    document.getElementById('linkCedula').value = '';
    showToast('Persona vinculada temporalmente. Guarde la sustanciación para aplicar cambios.', 'info');
}

}

window.eliminarPersonaVisual = function(casoId, cedula) {
    const addIdx = pendingInvolucradosAdd.findIndex(x => x.cedula === cedula);
    if (addIdx >= 0) {
        pendingInvolucradosAdd.splice(addIdx, 1);
    } else {
        pendingInvolucradosRemove.push(cedula);
    }
    document.getElementById('involucrados-wrapper').innerHTML = renderInvolucradosView(casoId);
    showToast('Persona desvinculada temporalmente. Guarde la sustanciación para aplicar cambios.', 'info');
}
async function iniciarSustanciacion(id) {
    const btn = event && event.currentTarget ? event.currentTarget : null;
    if (!lockAction(btn)) return;
    try { await waitForUndo("Iniciando sustanciación..."); } catch(err) { unlockAction(btn); return; }
    try {
        const c = db.casos.find(x => x.id == id);

        await fetch(`/api/db/investigaciones/id_investigacion/${id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ estatus: ESTADOS_CASO.SUSTANCIACION }) });
        await fetch('/api/db/casos_estado_historial', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ investigacion_id: id, estado_anterior: c.estado, estado_nuevo: ESTADOS_CASO.SUSTANCIACION, fecha_cambio: new Date().toISOString(), usuario_id: currentUser.id }) });

        pushEstadoLocal(c, ESTADOS_CASO.SUSTANCIACION);
        navigate('case-detail', {id});
        refreshInBackground();
    } finally {

async function submitSust(e, id) {
    e.preventDefault();
    if (!validarFormulario(e.target)) return;
    const btn = e.target.querySelector('button');

    // Validar que al menos el Documento 1 esté adjunto
    let c = db.casos.find(x => x.id == id);
    const hasExisting = c.sustanciacion;
    const f1 = document.getElementById('sustXls').files[0];
    if (!f1 && !hasExisting?.xls) {
        showToast('Debe adjuntar al menos el Documento 1 antes de enviar la sustanciación.', 'warning');
        return;
    }

    const finalInvolucrados = new Set([...c.personasInvolucradas, ...pendingInvolucradosAdd.map(a => a.cedula)]);
    pendingInvolucradosRemove.forEach(ced => finalInvolucrados.delete(ced));
    if (finalInvolucrados.size === 0) {
        showToast('Debe vincular al menos una persona involucrada antes de enviar la sustanciación.', 'warning');
        return;
    }

    if (!lockAction(btn)) return;
    try { await waitForUndo("Enviando sustanciación..."); } catch(err) { unlockAction(btn); return; }
    try {

    // Procesar vinculaciones/desvinculaciones pendientes
    for (const add of pendingInvolucradosAdd) {
        await fetch('/api/db/investigacion_persona', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ investigacion_id: id, persona_id: add.p_id, grado_implicacion: add.grado })
        });
        if (!c.personasInvolucradas.includes(add.cedula)) c.personasInvolucradas.push(add.cedula);
        c.implicaciones[add.cedula] = add.grado;
    }
    for (const rem of pendingInvolucradosRemove) {
        const p = db.personas.find(x => x.cedula === rem);
        if (p) {
            await fetch(`/api/db/investigacion_persona?investigacion_id=eq.${id}&persona_id=eq.${p.id}`, { method: 'DELETE' });
            c.personasInvolucradas = c.personasInvolucradas.filter(cd => cd !== rem);
            delete c.implicaciones[rem];
        }
    }
    pendingInvolucradosAdd = [];
    pendingInvolucradosRemove = [];

    const f2 = document.getElementById('sustPpt').files[0];
    const [adj1, adj2] = await Promise.all([readFileAsDataURL(f1), readFileAsDataURL(f2)]);

    let url1 = hasExisting ? hasExisting.xls : null;
    let url2 = hasExisting ? hasExisting.ppt : null;

    if (adj1 && f1) {
        const u1Res = await fetch('/api/upload', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fileBase64: adj1, fileName: f1.name}) });
        if(u1Res.ok) url1 = (await u1Res.json()).url;
    }
    if (adj2 && f2) {
        const u2Res = await fetch('/api/upload', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fileBase64: adj2, fileName: f2.name}) });
        if(u2Res.ok) url2 = (await u2Res.json()).url;
    }

    const sustDetalle = document.getElementById('sustText').value;
    const payload = {
        sustanciacion_detalle: sustDetalle,
        sustanciacion_doc1: url1,
        sustanciacion_doc2: url2,
        estatus: ESTADOS_CASO.REVISION_SUPERVISOR
    };

    const res = await fetch(`/api/db/investigaciones/id_investigacion/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    if (!res.ok) {
        await uiAlert("Error al guardar sustanciación.", 'Error');
        return;
    }

    // Registrar historial de estado
    await fetch('/api/db/casos_estado_historial', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            investigacion_id: id,
            estado_anterior: c.estado,
            estado_nuevo: ESTADOS_CASO.REVISION_SUPERVISOR,
            fecha_cambio: new Date().toISOString(),
            usuario_id: currentUser.id
        })
    });

    // Registrar mensaje
    await fetch('/api/db/casos_comentarios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            investigacion_id: id,
            autor_id: currentUser.id,
            texto: 'Sustanciación enviada a revisión.',
            fecha: new Date().toISOString()
        })
    });

    c.sustanciacion = { detalle: sustDetalle, xls: url1, ppt: url2 };
    const supervisor = c.supervisorAsignado || ROLES.SUPER;
    const coord = c.coordinadorAsignado || ROLES.COORD;
    pushEstadoLocal(c, ESTADOS_CASO.REVISION_SUPERVISOR);
    pushComentarioLocal(c, 'Sustanciación enviada a revisión.');
    notifyUser(supervisor, `Sustanciación lista para el Caso ${id}. Requiere tu revisión.`, { view: 'case-detail', params: { id } });
    notifyUser(coord, `El Especialista envió sustanciación del Caso ${id}. Puedes revisarla directamente.`, { view: 'case-detail', params: { id } });
    showToast('Sustanciación enviada a revisión.', 'success');
    navigate('casos');
    refreshInBackground();
    } finally {
        unlockAction(btn);
    }
}

async function cerrarCasoGerencia(e, id) {
    e.preventDefault();
    if (!validarFormulario(e.target)) return;
    const btn = e.target.querySelector('button');
    if (!lockAction(btn)) return;
    try { await waitForUndo("Cerrando caso..."); } catch(err) { unlockAction(btn); return; }
    try {
        const c = db.casos.find(x => x.id == id);
        const memo = document.getElementById('memoPdf').files[0];
        const memoBase64 = memo ? await readFileAsDataURL(memo) : null;

        let memoUrl = null;
        if (memoBase64 && memo) {
            const resUpload = await fetch('/api/upload', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fileBase64: memoBase64, fileName: memo.name}) });
            if(resUpload.ok) memoUrl = (await resUpload.json()).url;
        }

        const payload = {
            estatus: ESTADOS_CASO.CERRADO,
            conclusion: 'Caso cerrado por Gerencia. Memorándum emitido.',
            soporte_path: memoUrl
        };

        await fetch(`/api/db/investigaciones/id_investigacion/${id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        await fetch('/api/db/casos_estado_historial', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ investigacion_id: id, estado_anterior: c.estado, estado_nuevo: ESTADOS_CASO.CERRADO, fecha_cambio: new Date().toISOString(), usuario_id: currentUser.id }) });
        await fetch('/api/db/casos_comentarios', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ investigacion_id: id, autor_id: currentUser.id, texto: 'Caso cerrado por Gerencia. Memorándum emitido.', fecha: new Date().toISOString() }) });

        const chain = new Set([ROLES.SUPER, ROLES.COORD, c.creadorOriginal, c.especialistaAsignado, c.supervisorAsignado, c.coordinadorAsignado].filter(Boolean));
        c.memoFinal = memoUrl;
        c.conclusion = payload.conclusion;
        pushEstadoLocal(c, ESTADOS_CASO.CERRADO);
        pushComentarioLocal(c, 'Caso cerrado por Gerencia. Memorándum emitido.');
        chain.forEach(u => notifyUser(u, `Gerencia ha CERRADO el Caso ${id}. Memo adjunto.`, { view: 'case-detail', params: { id } }));
        showToast(`Caso ${id} cerrado exitosamente.`, 'success');
        navigate('casos');
        refreshInBackground();
    } finally {
        unlockAction(btn);
    }
}
