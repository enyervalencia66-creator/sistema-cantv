function toggleCargoInput(tipo) {
    const sel = document.getElementById('perPosSelect');
    const inp = document.getElementById('perPosInput');
    const hidden = document.getElementById('perPos');
    
    const perGen = document.getElementById('perGen');
    const perLin = document.getElementById('perLin');
    const perUni = document.getElementById('perUni');

    if (!sel || !inp || !hidden) return;
    
    const toggleField = (el, hide) => {
        if(!el) return;
        const group = el.closest('.form-group');
        if (group) group.style.display = hide ? 'none' : 'block';
        if (hide) {
            el.value = '';
            el.removeAttribute('required');
            const wrapper = el.closest('.custom-select-wrapper');
            if(wrapper) {
                const textSpan = wrapper.querySelector('.custom-select-text');
                if(textSpan) textSpan.value = 'Seleccione...';
            }
        } else {
            el.setAttribute('required', 'true');
        }
    };

    const selWrapper = sel.closest('.custom-select-wrapper') || sel;
    if (tipo === 'Externo' || tipo === 'Contratista') {
        selWrapper.style.display = 'none';
        sel.removeAttribute('required');
        sel.value = '';
        
        inp.style.display = 'block';
        inp.setAttribute('required', 'true');
        hidden.value = inp.value;
        
        toggleField(perGen, true);
        toggleField(perLin, true);
        toggleField(perUni, true);
    } else {
        selWrapper.style.display = 'block';
        sel.setAttribute('required', 'true');
        
        inp.style.display = 'none';
        inp.removeAttribute('required');
        inp.value = '';
        hidden.value = sel.value;
        
        toggleField(perGen, false);
        toggleField(perLin, false);
        toggleField(perUni, false);
    }
}

async function submitPersona(e) {
    e.preventDefault();
    if (!validarFormulario(e.target)) return;
    const btn = document.getElementById('btnGuardarPersona');

    const ced = document.getElementById('perCedula').value.trim();
    if(db.personas.find(p => p.cedula === ced)) {
        return showToast('Esta cédula ya existe en la base de datos.', 'error');
    }

    const p00 = document.getElementById('perP00').value.trim();
    if(db.personas.find(p => p.p00 === p00)) {
        return showToast('Este P00 ya existe en la base de datos.', 'error');
    }

    if (!lockAction(btn, 'Guardando...')) return;
    try { await waitForUndo("Guardando expediente..."); } catch(err) { unlockAction(btn); return; }

    const isExterno = document.getElementById('perTipo').value === 'Externo' || document.getElementById('perTipo').value === 'Contratista';
    let posId = document.getElementById('perPos').value || null;
    
    if (isExterno && posId) {
        const textTyped = posId.trim().toLowerCase();
        const existingPos = db.positions.find(p => p.description.toLowerCase() === textTyped);
        if (existingPos) {
            posId = existingPos.id_posicion;
        } else {
            try {
                const posRes = await fetch('/api/db/positions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: posId.trim() })
                });
                if (posRes.ok) {
                    const posData = await posRes.json();
                    if (posData.data && posData.data[0]) {
                        posId = posData.data[0].id_posicion;
                        db.positions.push({ id_posicion: posId, description: posData.data[0].description });
                    }
                } else {
                    unlockAction(btn);
                    return showToast('Error al registrar el nuevo cargo.', 'error');
                }
            } catch(e) {
                unlockAction(btn);
                return showToast('Error de red al registrar el cargo.', 'error');
            }
        }
    }

    const payload = {
        p00: p00,
        cedulas: ced,
        nacionalidad: document.getElementById('perNac').value,
        nombres: document.getElementById('perNombres').value.trim(),
        apellidos: document.getElementById('perApellidos').value.trim(),
        tipos: document.getElementById('perTipo').value,
        estatus: document.getElementById('perEstatus').value,
        coordenadas: document.getElementById('perCoord').value.trim() || null,
        position_id: posId,
        region_id: document.getElementById('perReg').value || null,
        unit_id: isExterno ? null : (document.getElementById('perUni').value || null),
        general_management_id: isExterno ? null : (document.getElementById('perGen').value || null),
        line_management_id: isExterno ? null : (document.getElementById('perLin').value || null)
    };
    
    try {
        const res = await fetch('/api/db/personas', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });

        if(!res.ok) throw new Error('Error de red o del servidor al guardar');
        const { data } = await res.json();
        const p = data[0];

        db.personas.push({
            id: p.id_persona || p.cedulas,
            p00: p.p00,
            cedula: p.cedulas,
            nacionalidad: p.nacionalidad,
            nombres: p.nombres,
            apellidos: p.apellidos,
            nombre: (p.nombres || '') + ' ' + (p.apellidos || ''),
            tipos: p.tipos,
            estatus: p.estatus,
            coordenadas: p.coordenadas,
            cargo: p.position_id,
            region: p.region_id,
            departamento: p.unit_id,
            gerencia_general: p.general_management_id,
            gerencia_linea: p.line_management_id,
            estudios: [],
            referencias: []
        });

        showToast('Persona registrada exitosamente en la base de datos.', 'success');
        navigate('expediente-detail', { cedula: ced });
        refreshInBackground();
    } catch(err) {
        showToast('Error crítico al guardar la persona: ' + err.message, 'error');
    } finally {
        unlockAction(btn);
    }
}

function marcarCampoInvalido(input, mensaje) {

}

// Valida un formulario usando las reglas HTML5 ya declaradas en sus campos (required, minlength,
// maxlength, pattern, type=email, etc.) pero sin las burbujas nativas del navegador, que podían
// aparecer mientras el usuario aún estaba escribiendo. El formulario debe llevar el atributo
// `novalidate` para que el navegador no muestre su propio aviso antes (o en paralelo) de este.
// Se detiene en el primer campo inválido y muestra un único toast, para que nunca se amontonen
// varias alertas a la vez.
function validarFormulario(form) {
    const invalid = form.querySelector(':invalid');
    if (!invalid) return true;

    // Busca el <label> más cercano y relevante: primero dentro de un contenedor conocido
    // (.form-group/.input-group), si no, solo entre los hijos directos del padre inmediato —
    // nunca una búsqueda profunda, para no engancharse con el label de OTRO campo del formulario.
    const scopedContainer = invalid.closest('.form-group, .input-group');
    const labelText = scopedContainer?.querySelector('label')?.textContent
        || invalid.parentElement?.querySelector(':scope > label')?.textContent;
    const label = (labelText || invalid.placeholder || invalid.name
        || (invalid.type === 'file' ? 'El archivo' : 'Este campo')).replace(/\*$/, '').trim();

    let mensaje;
    if (invalid.validity.valueMissing) mensaje = invalid.type === 'file' ? `Debe adjuntar ${label === 'El archivo' ? 'un archivo' : label}.` : `${label} es obligatorio.`;
    else if (invalid.validity.tooShort) mensaje = `${label} debe tener al menos ${invalid.minLength} caracteres.`;
    else if (invalid.validity.tooLong) mensaje = `${label} no puede superar los ${invalid.maxLength} caracteres.`;
    else if (invalid.validity.patternMismatch) mensaje = invalid.title ? `${label}: ${invalid.title}` : `${label} tiene un formato inválido.`;
    else if (invalid.validity.typeMismatch) mensaje = `${label} tiene un formato inválido.`;
    else mensaje = invalid.validationMessage || `${label} es inválido.`;

    if (invalid.tagName === 'SELECT' && invalid.dataset.customized) {
        const wrapper = invalid.closest('.custom-select-wrapper');
        if (wrapper) {
            const trigger = wrapper.querySelector('.custom-select-trigger');
            if (trigger) {
                trigger.style.borderColor = 'var(--status-high)';
                trigger.style.boxShadow = '0 0 0 3px rgba(239,68,68,0.18)';
            }
            if (wrapper.scrollIntoView) wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    } else {
        invalid.style.borderColor = 'var(--status-high)';
        invalid.focus();
        if (invalid.scrollIntoView) invalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    showToast(mensaje, 'warning');
    return false;
}

// Nombre de persona: solo letras (con tildes/ñ) y espacios; sin números ni símbolos.
function esNombreValido(nombre) {
    return /^[a-zA-ZÁÉÍÓÚáéíóúÑñÜü\s]+$/.test(nombre);
}

// Correo: usuario@dominio.tld, con un dominio de al menos 2 letras en el TLD y sin puntos
// consecutivos ni en los extremos, para evitar direcciones con dominio inválido/incompleto.
function esEmailValido(email) {
    if (/\.\./.test(email) || email.startsWith('.') || email.includes('@.')) return false;
    return /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}$/.test(email);
}

// Evita contraseñas que incluyan el nombre de usuario o alguna palabra (3+ letras) del nombre
// completo de la persona, ya que son fáciles de adivinar para quien conoce a esa persona.
function passwordContieneDatosPersonales(password, ...datos) {
    const passLower = password.toLowerCase();
    return datos.some(dato => {
        if (!dato) return false;
        return String(dato).toLowerCase().split(/[\s._-]+/)
            .filter(parte => parte.length >= 3)
            .some(parte => passLower.includes(parte));
    });
}

async function adminCrearUsuario(e) {
    if (e) e.preventDefault();
    const btn = e && e.target ? e.target.querySelector('button[type="submit"]') : null;
    const userEl = document.getElementById('nuUser');
    const nameEl = document.getElementById('nuName');
    const emailEl = document.getElementById('nuEmail');
    const telefonoEl = document.getElementById('nuTelefono');
    const passEl = document.getElementById('nuPass');
    const roleEl = document.getElementById('nuRole');
    const regionEl = document.getElementById('nuRegion');

    const username = userEl.value.trim();
    const nombre = nameEl.value.trim();
    const email = emailEl.value.trim();
    const telefono = telefonoEl.value.trim();
    const pass = passEl.value;
    const roleId = roleEl.value;
    const regionId = regionEl.value;

    [userEl, nameEl, emailEl, telefonoEl, passEl, roleEl, regionEl].forEach(el => el.style.borderColor = '');

    // Username: letras (con tildes/ñ), números, espacios y guiones bajos
    if (username.length < 4 || username.length > 30) {
        return marcarCampoInvalido(userEl, 'El username debe tener entre 4 y 30 caracteres.');
    }
    if (!/^[a-zA-Z0-9_ÁÉÍÓÚáéíóúÑñÜü ]+$/.test(username)) {
        return marcarCampoInvalido(userEl, 'El username solo puede contener letras, números, espacios y guiones bajos.');
    }
    if (db.users.some(u => (u.username || '').trim().toLowerCase() === username.toLowerCase())) {
        return marcarCampoInvalido(userEl, 'Ya existe un usuario con ese username.');
    }

    // Nombre completo: solo letras y espacios
    if (nombre.length < 4 || nombre.length > 50) {
        return marcarCampoInvalido(nameEl, 'El nombre completo debe tener entre 4 y 50 caracteres.');
    }
    if (!/^[a-zA-ZÁÉÍÓÚáéíóúÑñ\s]+$/.test(nombre)) {
        return marcarCampoInvalido(nameEl, 'El nombre completo solo puede contener letras y espacios.');
    }
    if (db.users.some(u => (u.name || '').trim().toLowerCase() === nombre.toLowerCase())) {
        return marcarCampoInvalido(nameEl, 'Ya existe un usuario registrado con este nombre completo.');
    }

    // Correo electrónico: formato válido y único
    if (!email) {
        return marcarCampoInvalido(emailEl, 'El correo electrónico es obligatorio.');
    }
    if (email.length > 100 || !esEmailValido(email)) {
        return marcarCampoInvalido(emailEl, 'Ingrese un correo electrónico válido con un dominio real (ej. usuario@dominio.com).');
    }
    if (db.users.some(u => (u.email || '').trim().toLowerCase() === email.toLowerCase())) {
        return marcarCampoInvalido(emailEl, 'Ya existe un usuario registrado con ese correo.');
    }

    // Teléfono: opcional, pero si se ingresa debe tener un formato de teléfono válido
    if (telefono && !/^[\d+\-\s]{7,20}$/.test(telefono)) {
        return marcarCampoInvalido(telefonoEl, 'Ingrese un teléfono válido (solo números, espacios y guiones).');
    }
    if (telefono && db.users.some(u => (u.telefono || '').replace(/\D/g, '') === telefono.replace(/\D/g, ''))) {
        return marcarCampoInvalido(telefonoEl, 'Ya existe un usuario registrado con este número de teléfono.');
    }

    // Contraseña: longitud mínima, al menos una letra y un número, y sin datos personales obvios
    if (pass.length < 8 || pass.length > 64) {
        return marcarCampoInvalido(passEl, 'La contraseña debe tener entre 8 y 64 caracteres.');
    }
    if (!/(?=.*[A-Za-z])(?=.*\d)/.test(pass)) {
        return marcarCampoInvalido(passEl, 'La contraseña debe incluir al menos una letra y un número.');
    }
    if (passwordContieneDatosPersonales(pass, username, nombre)) {
        return marcarCampoInvalido(passEl, 'La contraseña no debe contener el nombre ni el nombre de usuario de la persona.');
    }

    // Rol
    if (!roleId) {
        return marcarCampoInvalido(roleEl, 'Debe seleccionar un rol.');
    }

    // Región: determina qué incidencias/casos ve este usuario y con quién se le vincula
    // automáticamente (coordinador, supervisor, especialistas de su misma región).
    if (!regionId) {
        return marcarCampoInvalido(regionEl, 'Debe seleccionar una región.');
    }

    if (!lockAction(btn, 'Creando...')) return;
    try {
        const payload = {
            username,
            nombre: nombre || username,
            email,
            telefono: telefono || null,
            password: pass,
            role: roleId,
            regions: regionId,
            estado: 'activo'
        };

        const res = await fetch('/api/db/users', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
        });

        if(res.ok) {
            const { data } = await res.json();
            const u = data[0];
            const roleObj = db.roles.find(r => r.id_rol == u.role);
            const permIds = roleObj ? db.role_has_permissions.filter(rhp => rhp.role_id === roleObj.id_rol).map(rhp => rhp.permissions_id) : [];
            const userPerms = roleObj ? db.permissions.filter(p => permIds.includes(p.id)).map(p => p.name) : [];
            const regionObj = db.regions.find(r => r.id_region == u.regions);

            db.users.push({
                id: u.id || u.username,
                username: u.username,
                email: u.email,
                telefono: u.telefono,
                role: roleObj ? roleObj.name : 'Invitado',
                role_id: roleObj ? roleObj.id_rol : null,
                permissions: userPerms,
                name: u.nombre || u.username,
                region: regionObj ? regionObj.description : 'Nacional',
                estado: u.estado || 'activo'
            });

            closeModalUI(true);
            showToast('Usuario creado con éxito', 'success');
            navigate('admin-users');
            refreshInBackground();
        } else {
            try {
                const errJson = await res.json();
                showToast('Error: ' + (errJson.error || JSON.stringify(errJson)), 'error');
            } catch(e) {
                showToast('Error al crear usuario', 'error');
            }
        }
    } finally {
        unlockAction(btn);
    }
}

async function adminEjecutarEditarUsuario(userId) {
    const btn = event && event.currentTarget ? event.currentTarget : null;
    const usernameEl = document.getElementById('editUsername');
    const nameEl = document.getElementById('editName');
    const emailEl = document.getElementById('editEmail');
    const roleEl = document.getElementById('editRole');
    const regionEl = document.getElementById('editRegion');

    const username = usernameEl.value.trim();
    const nombre = nameEl.value.trim();
    const email = emailEl.value.trim();
    const roleId = roleEl.value;
    const regionId = regionEl.value;

    [usernameEl, nameEl, emailEl].forEach(el => el.style.borderColor = '');

    // Username: mismas reglas que al crear (letras, números, espacios y guiones bajos, 4-30 caracteres)
    if (username.length < 4 || username.length > 30) {
        return marcarCampoInvalido(usernameEl, 'El username debe tener entre 4 y 30 caracteres.');
    }
    if (!/^[a-zA-Z0-9_ÁÉÍÓÚáéíóúÑñÜü ]+$/.test(username)) {
        return marcarCampoInvalido(usernameEl, 'El username solo puede contener letras, números, espacios y guiones bajos.');
    }
    if (db.users.some(u => u.id != userId && (u.username || '').trim().toLowerCase() === username.toLowerCase())) {
        return marcarCampoInvalido(usernameEl, 'Ya existe un usuario con ese username.');
    }

    // Nombre completo: solo letras y espacios, sin números
    if (nombre.length < 4 || nombre.length > 50) {
        return marcarCampoInvalido(nameEl, 'El nombre completo debe tener entre 4 y 50 caracteres.');
    }
    if (!esNombreValido(nombre)) {
        return marcarCampoInvalido(nameEl, 'El nombre completo solo puede contener letras y espacios.');
    }

    // Correo electrónico: formato válido, dominio real y único
    if (!email) {
        return marcarCampoInvalido(emailEl, 'El correo electrónico es obligatorio.');
    }
    if (email.length > 100 || !esEmailValido(email)) {
        return marcarCampoInvalido(emailEl, 'Ingrese un correo electrónico válido con un dominio real (ej. usuario@dominio.com).');
    }
    if (db.users.some(u => u.id != userId && (u.email || '').trim().toLowerCase() === email.toLowerCase())) {
        return marcarCampoInvalido(emailEl, 'Ya existe un usuario registrado con ese correo.');
    }

    if (!roleId) {
        return marcarCampoInvalido(roleEl, 'Debe seleccionar un rol.');
    }
    if (!regionId) {
        return marcarCampoInvalido(regionEl, 'Debe seleccionar una región.');
    }

    if (!lockAction(btn, 'Guardando...')) return;
    try {
        const payload = {
            username: username,
            nombre: nombre || username,
            email: email,
            role: roleId,
            regions: regionId
        };

        const res = await fetch(`/api/db/users/id/${userId}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
        });

        if(res.ok) {
            const u = db.users.find(x => x.id == userId);
            const roleObj = db.roles.find(r => r.id_rol == roleId);
            const permIds = roleObj ? db.role_has_permissions.filter(rhp => rhp.role_id === roleObj.id_rol).map(rhp => rhp.permissions_id) : [];
            const userPerms = roleObj ? db.permissions.filter(p => permIds.includes(p.id)).map(p => p.name) : [];
            const regionObj = db.regions.find(r => r.id_region == regionId);
            Object.assign(u, {
                username, email,
                name: nombre || username,
                role: roleObj ? roleObj.name : u.role,
                role_id: roleObj ? roleObj.id_rol : u.role_id,
                permissions: userPerms,
                region: regionObj ? regionObj.description : u.region
            });

            closeModalUI(true);
            showToast('Usuario actualizado con éxito', 'success');
            navigate('admin-users');
            refreshInBackground();
        } else {
            showToast('Error al actualizar usuario', 'error');
        }
    } finally {
        unlockAction(btn);
    }
}

async function adminResetearClave(userId) {
    const btn = event && event.currentTarget ? event.currentTarget : null;
    const ok = await uiConfirm('¿Seguro que desea reestablecer la contraseña de este usuario a "CANTV123"?', 'Reestablecer Contraseña');
    if(!ok) return;

    if (!lockAction(btn, 'Reestableciendo...')) return;
    try {
        const u = db.users.find(x => x.id == userId);
        const wasBlocked = u && u.estado && u.estado.toLowerCase() === 'bloqueado';
        const payload = wasBlocked ? { password: 'CANTV123', estado: 'activo' } : { password: 'CANTV123' };
        const res = await fetch(`/api/db/users/id/${userId}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
        });
        if(res.ok) {
            if (wasBlocked && u) u.estado = 'activo';
            showToast(wasBlocked ? 'Contraseña reestablecida y usuario desbloqueado' : 'Contraseña reestablecida exitosamente', 'success');
        } else {
            showToast('Error al reestablecer contraseña', 'error');
        }
    } finally {
        unlockAction(btn);
    }
}

async function bootApp() {
    // /api/db/init ahora exige sesión: si no hay token guardado, ni se intenta (así un visitante
    // sin loguearse nunca recibe ningún dato). Si el token existe pero ya no es válido (expiró o
    // el servidor se reinició), la petición falla y se limpia la sesión vieja.
    const token = sessionStorage.getItem('cantv_token');
    const user = sessionStorage.getItem('cantv_user');
    if (token && user) {
        try {
            await initDB();
            const found = db.users.find(x => x.username === user);
            if (found && (!found.estado || found.estado.toLowerCase() !== 'inactivo')) {
                currentUser = found;
                resetInactivityTimer();
                return navigate('casos');
            }
        } catch (e) {
            console.error('No se pudo restaurar la sesión:', e);
        }
        sessionStorage.removeItem('cantv_token');
        sessionStorage.removeItem('cantv_user');
    }
    navigate('login');
}

document.addEventListener('input', function(e) {

    // Nombres y Apellidos: Solo letras y espacios
    if (e.target.matches('input[id*="name" i], input[id*="nombre" i], input[id*="apellido" i], input[id*="contacto" i]')) {
        let val = e.target.value;
        let newVal = val.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
        if (val !== newVal) {
            e.target.value = newVal;
        }
    }
    
    // Teléfonos: Solo números, máx 12 caracteres
    if (e.target.matches('input[type="tel" i], input[id*="telefono" i]')) {
        let val = e.target.value;
        let newVal = val.replace(/\D/g, '').slice(0, 12);
        if (val !== newVal) {
            e.target.value = newVal;
        }
    }
    
    // Cédulas: Solo números, máx 10 caracteres
    if (e.target.matches('input[id*="cedula" i]')) {
        let val = e.target.value;
        let newVal = val.replace(/\D/g, '').slice(0, 10);
        if (val !== newVal) {
            e.target.value = newVal;
        }
    }
});

// Automatically convert native selects to custom ones
function initializeSelect(select) {
    if (select.dataset.customized) return;
    select.dataset.customized = "true";

    const wrapper = document.createElement('div');
    wrapper.className = 'custom-select-wrapper';
    wrapper.style.position = 'relative';
    
    select.parentNode.insertBefore(wrapper, select);
    wrapper.appendChild(select);
    
    // Hide native select but keep it accessible for form validation
    select.style.position = 'absolute';
    select.style.opacity = '0';
    select.style.pointerEvents = 'none';
    select.style.height = '100%';
    select.style.width = '100%';
    select.style.zIndex = '-1';

    const trigger = document.createElement('div');
    trigger.className = 'custom-select-trigger input-field';
    trigger.style.display = 'flex';
    trigger.style.justifyContent = 'space-between';
    trigger.style.alignItems = 'center';
    trigger.style.cursor = 'text';
    trigger.style.background = '#ffffff';
    trigger.style.padding = '0';
    trigger.style.overflow = 'hidden';
    
    const triggerInput = document.createElement('input');
    triggerInput.type = 'text';
    triggerInput.className = 'custom-select-text';
    triggerInput.style.border = 'none';
    triggerInput.style.outline = 'none';
    triggerInput.style.background = 'transparent';
    triggerInput.style.width = '100%';
    triggerInput.style.height = '100%';
    triggerInput.style.padding = '0.8rem 1rem';
    triggerInput.style.fontFamily = 'inherit';
    triggerInput.style.fontSize = 'inherit';
    triggerInput.style.color = 'inherit';
    
    const updateTriggerText = () => {
        const selectedOpt = select.options[select.selectedIndex];
        const text = selectedOpt ? selectedOpt.text : 'Seleccione...';
        triggerInput.value = text;
        triggerInput.placeholder = text;
    };
    updateTriggerText();

    const arrowSvg = document.createElement('div');
    arrowSvg.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
    arrowSvg.style.pointerEvents = 'none';
    arrowSvg.style.flexShrink = '0';
    arrowSvg.style.paddingRight = '1rem';
    arrowSvg.style.cursor = 'pointer';
    
    trigger.appendChild(triggerInput);
    trigger.appendChild(arrowSvg);
    wrapper.appendChild(trigger);

    const optionsMenu = document.createElement('div');
    optionsMenu.className = 'custom-select-options glass-card';
    optionsMenu.style.position = 'absolute';
    optionsMenu.style.top = '100%';
    optionsMenu.style.left = '0';
    optionsMenu.style.right = '0';
    optionsMenu.style.zIndex = '9999';

    optionsMenu.style.maxHeight = '250px';

    optionsMenu.style.padding = '4px 0';
    optionsMenu.style.boxShadow = '0 10px 25px -5px rgba(0, 0, 0, 0.1)';
    optionsMenu.style.background = '#ffffff';

    const buildOptions = (filterText = '') => {
        optionsMenu.innerHTML = '';
        const term = filterText.toLowerCase().trim();
        let hasVisible = false;

        Array.from(select.options).forEach(opt => {
            if(opt.style.display === 'none') return;
            if(term && !opt.text.toLowerCase().includes(term)) return;
            hasVisible = true;
            
            const optDiv = document.createElement('div');
            optDiv.className = 'custom-select-option';
            optDiv.textContent = opt.text;
            optDiv.style.padding = '0.65rem 1rem';
            optDiv.style.cursor = 'pointer';

                optDiv.style.background = 'var(--cantv-blue-light)';
                optDiv.style.color = '#fff';
                optDiv.style.fontWeight = 'bold';
            } else {
                optDiv.addEventListener('mouseenter', () => optDiv.style.background = '#f3f4f6');
                optDiv.addEventListener('mouseleave', () => optDiv.style.background = 'transparent');
            }
            
            optDiv.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                select.value = opt.value;
                select.dispatchEvent(new Event('change', { bubbles: true }));
                updateTriggerText();
                optionsMenu.style.display = 'none';
                buildOptions(); 
            });
            optionsMenu.appendChild(optDiv);
        });

        if(!hasVisible) {
            const noRes = document.createElement('div');
            noRes.textContent = 'No se encontraron resultados';
            noRes.style.padding = '0.65rem 1rem';
            noRes.style.fontSize = '0.85rem';
            noRes.style.color = '#6b7280';
            noRes.style.textAlign = 'center';
            optionsMenu.appendChild(noRes);
        }
    };
    buildOptions();
    wrapper.appendChild(optionsMenu);

    triggerInput.addEventListener('input', (e) => {
        buildOptions(e.target.value);
        optionsMenu.style.display = 'block';
    });
    
    triggerInput.addEventListener('focus', () => {
        triggerInput.value = ''; // clear text so they can type freely
        buildOptions(''); // Show all options initially on focus
        document.querySelectorAll('.custom-select-options').forEach(m => m.style.display = 'none');
        optionsMenu.style.display = 'block';
    });
    
    triggerInput.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    triggerInput.addEventListener('blur', () => {
        // We delay the blur action so the click on an option registers first
        setTimeout(() => {
            if(!wrapper.contains(document.activeElement)) {
                updateTriggerText(); // Restore original text if they didn't click an option
                optionsMenu.style.display = 'none';
            }
        }, 150);
    });
    
    arrowSvg.addEventListener('click', (e) => {
        e.stopPropagation();
        if (optionsMenu.style.display === 'block') {
            optionsMenu.style.display = 'none';
        } else {
            triggerInput.focus();
        }
    });

    const observer = new MutationObserver(() => {
        updateTriggerText();
        buildOptions();
    });
    observer.observe(select, { childList: true, attributes: true, attributeFilter: ['value'] });
    
    select.addEventListener('change', () => {
        updateTriggerText();
        buildOptions();
        trigger.style.borderColor = '';
        trigger.style.boxShadow = '';
    });
}

document.addEventListener('click', () => {
    document.querySelectorAll('.custom-select-options').forEach(m => m.style.display = 'none');
});

const selectObserver = new MutationObserver((mutations) => {
    mutations.forEach(mutation => {
        mutation.addedNodes.forEach(node => {
            if (node.nodeType === 1) {
                if (node.tagName === 'SELECT' && node.classList.contains('input-field')) {
                    initializeSelect(node);
                }
                const selects = node.querySelectorAll ? node.querySelectorAll('select.input-field') : [];
                selects.forEach(initializeSelect);
            }
        });
    });
});
selectObserver.observe(document.body, { childList: true, subtree: true });

document.querySelectorAll('select.input-field').forEach(initializeSelect);
</script>
</body>
</html>
